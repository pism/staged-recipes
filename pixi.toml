"$schema" = "https://pixi.sh/v0.59.0/schema/manifest/schema.json"

[workspace]
name = "staged-recipes"
requires-pixi = ">=0.59.0"
description = "The entry point to conda-forge"
version = "0.1.0"
license = "BSD-3-Clause"
license-file = "LICENSE.txt"
authors = ["@conda-forge/core"]
channels = ["conda-forge"]
platforms = [
    "linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"
    # TODO: add here and below in `feature.win` when possible
    # "win-arm64"
]

[feature.python.dependencies]
python = ">=3.14.3,<3.15"

[feature.build.dependencies]
conda = ">=26.1.1,<27"
conda-libmamba-solver = ">=25.11.0,<26"
conda-build = ">=26.1.0,<27"
conda-index = ">=0.7.0,<0.8"
conda-forge-ci-setup = ">=4.24.2,<5"
conda-forge-pinning = ">=2026.3.18.17.42.56,<2027"
frozendict = ">=2.4.7,<3"
networkx = ">=3.6.1,<4"
rattler-build-conda-compat = ">=1.4.11,<2"

[feature.linux]
# The linux feature runs on every platform that can run Docker.
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
[feature.linux.dependencies]
rattler-build = "*"
[feature.linux.tasks.build-linux]
description = "build for Linux inside a docker container"
cmd = "python build-locally.py --filter 'linux*'"

[feature.osx]
# The osx env will run directly on the machine.
platforms = ["osx-64", "osx-arm64"]
[feature.osx.tasks.build-osx]
description = "build directly on a MacOS host machine"
cmd = "python build-locally.py --filter 'osx*'"
[feature.osx.tasks.build-osx.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"
OSX_SDK_DIR = "$PIXI_PROJECT_ROOT/.pixi/macOS-SDKs"

[feature.osx.dependencies]
rattler-build = "*"

[feature.win]
# The windows env will run directly on the machine.
platforms = ["win-64"]
[feature.win.tasks.build-win]
description = "build directly on a Windows host machine"
cmd = "python build-locally.py --filter 'win*'"
[feature.win.tasks.build-win.env]
CONDA_BLD_PATH = "$PIXI_PROJECT_ROOT/build_artifacts"
MINIFORGE_HOME = "$CONDA_PREFIX"

[feature.grayskull.dependencies]
grayskull = ">=3.1.0,<4"
conda-recipe-manager = ">=0.10.0,<0.11"
[feature.grayskull.tasks.pypi]
description = "generate a v1 (rattler-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.cran]
description = "generate a v1 (rattler-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge --use-v1-format"
[feature.grayskull.tasks.pypi-v0]
description = "generate a v0 (conda-build) recipe for a PyPI package name with `grayskull`"
cmd = "cd recipes && grayskull pypi --strict-conda-forge"
[feature.grayskull.tasks.cran-v0]
description = "generate a v0 (conda-build) recipe for a CRAN package name with `grayskull`"
cmd = "cd recipes && grayskull cran --strict-conda-forge"

[feature.conda-smithy.dependencies]
conda-smithy = ">=3.57.0,<4"
[feature.conda-smithy.tasks.lint]
description = "validate all recipes with `conda-smithy`"
cmd = "conda-smithy recipe-lint --conda-forge recipes/*"

[feature.shellcheck]
# merge this with `conda-smithy` when available for `linux-ppc64le`
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
dependencies.shellcheck = ">=0.11.0,<0.12"

[environments]
# linux uses Docker for build-linux and rattler-build natively for rattler-linux.
linux = ["linux", "python", "build"]
# osx and win do run natively on the machine, so we need the build deps too
osx = ["osx", "python", "build"]
win = ["win", "python", "build"]
build = ["python", "build"]
grayskull = ["python", "grayskull"]
conda-smithy = ["python", "conda-smithy", "shellcheck"]

[dependencies]
conda-build = ">=26.3.0,<27"

[feature.osx.tasks.rattler-osx]
description = "build all v1 recipes on osx-arm64 with rattler-build"
# Per-recipe loop in explicit dependency order. Avoids the rattler-build
# --recipe-dir topological-sort bug where pism-openmpi gets queued before
# yac-openmpi when yac has both mpich+openmpi variants but pism is
# openmpi-only. After each build, chmod 644 the new .conda artifacts so
# the next recipe's rattler-build invocation can fetch them from the
# local file:// channel (otherwise mode-600 .conda files cause an
# intermittent "failed to fetch" error).
#
# We pass the conda-forge global pinning (-m .pixi/envs/osx/conda_build_config.yaml)
# *before* the per-recipe one so the recipe-level mpi list overrides only what
# we want overridden; everything else (python, openmpi, c_stdlib, ...) comes
# from the global pinning, exactly like real conda-forge CI.
cmd = """
bash -ec '
mkdir -p "$PIXI_PROJECT_ROOT/output";
# Strip channel_sources / channel_targets from the global pinning
# (rattler-build forbids them alongside -c flags). Everything else
# (python, openmpi, c_stdlib, compiler versions, ...) is preserved.
# The output must be named exactly "conda_build_config.yaml" or
# rattler-build refuses to honor the # [selector] comments inside.
GLOBAL_PIN_RAW="$PIXI_PROJECT_ROOT/.pixi/envs/osx/conda_build_config.yaml";
GLOBAL_PIN_DIR="$PIXI_PROJECT_ROOT/output/global-pin-filtered";
GLOBAL_PIN="$GLOBAL_PIN_DIR/conda_build_config.yaml";
mkdir -p "$GLOBAL_PIN_DIR";
python3 "$PIXI_PROJECT_ROOT/.scripts/filter-global-pin.py" "$GLOBAL_PIN_RAW" "$GLOBAL_PIN";
for r in yaxt yac pism pism-dev; do
  echo "=== Building $r ===";
  rattler-build build \\
      --recipe "recipes/$r/recipe.yaml" \\
      -m "$GLOBAL_PIN" \\
      -m "recipes/$r/conda_build_config.yaml" \\
      -c "file://$PIXI_PROJECT_ROOT/output" \\
      -c conda-forge \\
      --target-platform osx-arm64 \\
      --output-dir "$PIXI_PROJECT_ROOT/output" || break;
  chmod 644 "$PIXI_PROJECT_ROOT/output/osx-arm64/"*.conda 2>/dev/null || true;
  # Re-index with conda-index so the local channel repodata sha256s
  # match the actual .conda files on disk. rattler-build occasionally
  # records pre-finalized hashes that mismatch and downstream fetches
  # then fail with "failed to fetch <pkg>.conda".
  echo "  re-indexing local channel...";
  python3 -m conda_index "$PIXI_PROJECT_ROOT/output" >/dev/null;
done
'
"""

[feature.osx.tasks.rattler-osx.env]
RATTLER_CACHE_DIR = "$HOME/.rattler-cache"

[feature.linux.tasks.rattler-linux]
description = "build all v1 recipes on linux-64 with rattler-build"
# Per-recipe loop in explicit dependency order. Avoids the rattler-build
# --recipe-dir topological-sort bug where pism-openmpi gets queued before
# yac-openmpi when yac has both mpich+openmpi variants but pism is
# openmpi-only. After each build, chmod 644 the new .conda artifacts so
# the next recipe's rattler-build invocation can fetch them from the
# local file:// channel (otherwise mode-600 .conda files cause an
# intermittent "failed to fetch" error).
#
# We pass the conda-forge global pinning (-m .pixi/envs/linux/conda_build_config.yaml)
# *before* the per-recipe one so the recipe-level mpi list overrides only what
# we want overridden; everything else (python, openmpi, c_stdlib, ...) comes
# from the global pinning, exactly like real conda-forge CI.
cmd = """
bash -ec '
mkdir -p "$PIXI_PROJECT_ROOT/output";
# Strip channel_sources / channel_targets from the global pinning
# (rattler-build forbids them alongside -c flags). Everything else
# (python, openmpi, c_stdlib, compiler versions, ...) is preserved.
# The output must be named exactly "conda_build_config.yaml" or
# rattler-build refuses to honor the # [selector] comments inside.
GLOBAL_PIN_RAW="$PIXI_PROJECT_ROOT/.pixi/envs/linux/conda_build_config.yaml";
GLOBAL_PIN_DIR="$PIXI_PROJECT_ROOT/output/global-pin-filtered";
GLOBAL_PIN="$GLOBAL_PIN_DIR/conda_build_config.yaml";
mkdir -p "$GLOBAL_PIN_DIR";
