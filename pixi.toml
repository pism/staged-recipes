      -m "recipes/$r/conda_build_config.yaml" \\
      -c "file://$PIXI_PROJECT_ROOT/output" \\
      -c conda-forge \\
      --target-platform linux-64 \\
      --output-dir "$PIXI_PROJECT_ROOT/output" || break;
  chmod 644 "$PIXI_PROJECT_ROOT/output/linux-64/"*.conda 2>/dev/null || true;
  # Re-index with conda-index so the local channel repodata sha256s
  # match the actual .conda files on disk. rattler-build occasionally
  # records pre-finalized hashes that mismatch and downstream fetches
  # then fail with "failed to fetch <pkg>.conda".
  echo "  re-indexing local channel...";
  python3 -m conda_index "$PIXI_PROJECT_ROOT/output" >/dev/null;
done
'
"""

[feature.linux.tasks.rattler-linux.env]
RATTLER_CACHE_DIR = "$HOME/.rattler-cache"
