{% set name = "pism" %}
{% set version = "2.2.1" %}
{% set build = 0 %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pism/pism/archive/v{{ version }}.tar.gz
  sha256: 98e21671e503c890c1f211b00166344798db8ff9109dcb97593febc0a124ebe2

build:
  skip: true  # [win or mpi == 'openmpi']
  number: {{ build }}

  # add build string so packages can depend on mpi variants explicitly:
  # `pism * mpi_mpich_*` for mpich
  # `pism * mpi_openmpi_*` for openmpi
  # `pism * mpi_*` for any mpi

  {% set mpi = mpi or "mpich" %}
  {% set mpi_prefix = "mpi_" + mpi %}
  string: {{ mpi_prefix }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}
    - {{ name }} * {{ mpi_prefix }}_*

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake >=3.16
    - pkg-config
    - make
    - swig
    - gnuconfig   # [unix]
  host:
    - python
    - fftw * mpi_{{ mpi }}_*
    - libnetcdf * mpi_{{ mpi }}_*
    - gsl >=1.15
    - {{ mpi }}
    - udunits2
    - proj
    - liblzma-devel  # Needed for `pkg-config --exists proj` on at least some python version
    - petsc
    - petsc4py
    - nose  # Drop? listed as optional; used by PISM’s regression tests
    - yac * mpi_{{ mpi }}_*
    # possible over linking for packages below; packaging errors like:
    #     ERROR (pism,lib/libpism.so.2.2.1): Needed DSO lib/yac.so.4 found in ['conda-forge/linux-64::blis==0.9.0=h4ab18f5_2']
    #      ERROR (pism,lib/libpism.so.2.2.1): .. but ['conda-forge/linux-64::blis==0.9.0=h4ab18f5_2'] not in reqs/run, (i.e. it is overlinking) (likely) or a missing dependency (less likely)
    - blis
    - libopenblas
    - yaxt * mpi_{{ mpi }}_*
  run:
    - python
    - fftw * mpi_{{ mpi }}_*
    - libnetcdf * mpi_{{ mpi }}_*
    - gsl >=1.15
    - {{ mpi }}
    - udunits2
    - proj
    - liblzma-devel  # Needed for `pkg-config --exists proj`
    - petsc
    - petsc4py
    - nose  # Drop? listed as optional; used by PISM’s regression tests
    - yac * mpi_{{ mpi }}_*
    # possible over linking for packages below; packaging errors like:
    #     ERROR (pism,lib/libpism.so.2.2.1): Needed DSO lib/yac.so.4 found in ['conda-forge/linux-64::blis==0.9.0=h4ab18f5_2']
    #      ERROR (pism,lib/libpism.so.2.2.1): .. but ['conda-forge/linux-64::blis==0.9.0=h4ab18f5_2'] not in reqs/run, (i.e. it is overlinking) (likely) or a missing dependency (less likely)
    - blis
    - libopenblas
    - yaxt * mpi_{{ mpi }}_*


    # Nice-to-haves: different build target?
    # - xarray
    # - pandas
    # - matplotlib


test:
  imports:
    - PISM
    - siple
  requires:
    - pip
  commands:
    - pip check
    - pism

about:
  home: https://github.com/pism/pism
  summary: PISM, a Parallel Ice Sheet Model
  description: |
    The Parallel Ice Sheet Model is an open source, parallel, high-resolution ice sheet model:
      - hierarchy of available stress balances
      - marine ice sheet physics, dynamic calving fronts
      - polythermal, enthalpy-based conservation of energy scheme
      - extensible coupling to atmospheric and ocean models
      - verification and validation tools
      - `documentation <pism-manual_>`_ for users and developers
      - uses MPI_ and PETSc_ for parallel simulations
      - reads and writes `CF-compliant <cf_>`_  NetCDF_ files
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  doc_url: https://pism.io
  dev_url: https://github.com/pism/pism

extra:
  recipe-maintainers:
    - aaschwanden
    - ckhroulev
    - jhkennedy
