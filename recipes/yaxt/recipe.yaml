schema_version: 1

context:
  name: yaxt
  version: "0.11.5.1"
  build: 0
  mpi: ${{ mpi | default("mpich") }}
  mpi_prefix: mpi_${{ mpi }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.dkrz.de/dkrz-sw/${{ name }}/-/archive/v${{ version }}/${{ name }}-v${{ version }}.tar.gz
  sha256: 0bc97acd6cfd8e893318e59daa57e9063cf79644311fc71cdd00597cb89bcc29

build:
  number: ${{ build }}
  skip:
    - win
  # Build string so packages can depend on mpi variants explicitly:
  #   `yaxt * mpi_mpich_*`   for mpich
  #   `yaxt * mpi_openmpi_*` for openmpi
  #   `yaxt * mpi_*`         for any mpi
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - autoconf
    - automake
    - libtool
    - make
    - pkg-config
  host:
    - if: mpi == "openmpi"
      then: ${{ mpi }} >=5
      else: ${{ mpi }}
    - ${{ mpi }}-mpifort
  run:
    - if: mpi == "openmpi"
      then: ${{ mpi }} >=5
      else: ${{ mpi }}
    - ${{ mpi }}-mpifort
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x.x") }}
    - ${{ name }} * ${{ mpi_prefix }}_*

tests:
  - script:
      - if: linux
        then: test -f ${PREFIX}/lib/libyaxt.so
      - if: osx
        then: test -f ${PREFIX}/lib/libyaxt.dylib
      - if: linux
        then: test -f ${PREFIX}/lib/libyaxt_c.so
      - if: osx
        then: test -f ${PREFIX}/lib/libyaxt_c.dylib
      - test -f ${PREFIX}/include/yaxt.h
      - test -f ${PREFIX}/include/yaxt.mod

about:
  homepage: https://gitlab.dkrz.de/dkrz-sw/yaxt
  summary: Yet Another eXchange Tool (yaxt) for coupling of Earth system model components.
  description: |
    Yet Another eXchange Tool (yaxt) is a lightweight software library for
    coupling of Earth system model components which provides automated data
    redistributions in distributed memory applications.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://dkrz-sw.gitlab-pages.dkrz.de/yaxt/index.html
  repository: https://gitlab.dkrz.de/dkrz-sw/yaxt

extra:
  recipe-maintainers:
    - jhkennedy
    - ckhroulev
    - aaschwanden
